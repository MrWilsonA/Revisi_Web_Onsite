services:
  service:
    restart: on-failure
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      pgpool:
        condition: service_started
      redis:
        condition: service_started
    env_file:
      - ./backend/.env
    networks:
      - eskrim

  postgres-master:
    image: bitnami/postgresql:latest
    environment:
      POSTGRESQL_USERNAME: ${POSTGRESQL_USERNAME}
      POSTGRESQL_PASSWORD: ${POSTGRESQL_PASSWORD}
      POSTGRESQL_REPLICATION_USER: ${POSTGRESQL_REPLICATION_USER}
      POSTGRESQL_REPLICATION_PASSWORD: ${POSTGRESQL_REPLICATION_PASSWORD}
      POSTGRESQL_REPLICATION_MODE: master
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "postgres" ]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    volumes:
      - postgres_master_data:/bitnami/postgresql
      - ./init-db:/docker-entrypoint-initdb.d
    networks:
      - eskrim

  postgres-slave:
    image: bitnami/postgresql:latest
    environment:
      POSTGRESQL_USERNAME: ${POSTGRESQL_USERNAME}
      POSTGRESQL_PASSWORD: ${POSTGRESQL_PASSWORD}
      POSTGRESQL_REPLICATION_USER: ${POSTGRESQL_REPLICATION_USER}
      POSTGRESQL_REPLICATION_PASSWORD: ${POSTGRESQL_REPLICATION_PASSWORD}
      POSTGRESQL_REPLICATION_MODE: slave
      POSTGRESQL_MASTER_HOST: postgres-master
      POSTGRESQL_MASTER_POST_NUMBER: 5432
    volumes:
      - postgres_slave_data:/bitnami/postgresql
    depends_on:
      postgres-master:
        condition: service_healthy
    networks:
      - eskrim

  pgpool:
    image: mrgreen007/pgpool:latest
    environment:
      PGPOOL_BACKEND_NODES: 0:postgres-master:5432,1:postgres-slave:5432
      PGPOOL_SR_CHECK_USER: ${POSTGRESQL_REPLICATION_USER}
      PGPOOL_SR_CHECK_PASSWORD: ${POSTGRESQL_REPLICATION_PASSWORD}
      PGPOOL_POSTGRES_USERNAME: ${POSTGRESQL_USERNAME}
      PGPOOL_POSTGRES_PASSWORD: ${POSTGRESQL_PASSWORD}
      PGPOOL_ADMIN_USERNAME: ${PGPOOL_ADMIN_USERNAME}
      PGPOOL_ADMIN_PASSWORD: ${PGPOOL_ADMIN_PASSWORD}
    depends_on:
      postgres-master:
        condition: service_healthy
      postgres-slave:
        condition: service_started
    ports:
      - "5432:5432"
    networks:
      - eskrim

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - eskrim

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - eskrim

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    ports:
      - "8333:8333"
    command: 'server -dir:/data -s3 -s3.config=/etc/seaweedfs/s3.json -filer'
    volumes:
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
      - seaweedfs_data:/data
    networks:
      - eskrim

  nginx:
    image: nginx:alpine
    ports:
      - 80:80
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - service
      - frontend
      - seaweedfs
    networks:
      - eskrim

networks:
  eskrim:
    driver: bridge

volumes:
  redis_data:
    driver: local
  postgres_master_data:
  postgres_slave_data:
  seaweedfs_data:
